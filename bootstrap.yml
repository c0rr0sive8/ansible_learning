---

- hosts: all
  become: true
  pre_tasks:


  - name: install updates on Rocky
    tags: always
    dnf:
      name: "*"
      state: latest
    when: ansible_distribution == "Rocky"


  - name: install update on Ubuntu
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"


- hosts: all
  become: true
  tasks:

  - name: Create user Bob
    tags: always
    user:
      name: bob
      group: root


  - name: Add SSH-Key for Bob
    tags: always
    authorized_key:
      user: bob
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIArybSn/1KTwHCcQ84bD6cYqNghrHgIAkVJZ9EAQL83d ansible"    

  - name: Add sudoers file for Bob
    tags: always
    copy:
      src: sudoer_bob
      dest: /etc/sudoers.d/bob
      owner: root
      group: root
      mode: 0440




