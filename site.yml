---

- hosts: all
  become: true
  pre_tasks:


  - name: Updates the repositories on Rocky
    tags: always
    dnf:
      update_cache: yes
    changed_when: false
    when: ansible_distribution == "Rocky"


  - name: Update the repositories on Ubuntu
    tags: always
    apt:
      update_cache: yes
    changed_when: false
    when: ansible_distribution == "Ubuntu"


- hosts: all
  become: true
  tasks:

  - name: Add SSH-Key for Bob
    tags: always
    authorized_key:
      user: bob
      key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIArybSn/1KTwHCcQ84bD6cYqNghrHgIAkVJZ9EAQL83d ansible"    



- hosts: workstations
  become: true
  tasks:

  - name: Install unzip
    package:
      name: unzip
      state: latest

  - name: Install terraform
    unarchive:
      src: https://releases.hashicorp.com/terraform/1.17.1/terraform_1.17.1_linux_amd64.zip
      dest: /usr/local/bin
      remote_src: yes
      mode: 0755
      owner: root
      group: root




- hosts: web_servers
  become: true
  tasks:


  - name: Install the Apache & PHP-Common package on Rocky
    tags: apache,rockylinux,httpd
    dnf:
      name:
        - httpd
        - php-common
      state: latest
    when: ansible_distribution == "Rocky"


  - name: Start httpd on Rocky Linux
    tags: apache, rockylinux,httpd
    service:
      name: httpd
      state: started
      enabled: yes
    when: ansible_distribution == "Rocky"



  - name: Change e-mail address for admin
    tags: apache,rockylinux,httpd
    lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: '^ServerAdmin'
      line: ServerAdmin somebody@somewhere.net
    when: ansible_distribution == "Rocky"
    register: httpd


  - name: Restart httpd on Rocky Linux
    tags: apache,rockylinux,httpd
    service:
      name: httpd
      state: restarted
    when: httpd.changed




  - name: Install the Apache & PHP-Common package on Ubuntu
    tags: apache,apache2,ubuntu
    apt:
      name:
        - apache2
        - php-common
      state: latest
    when: ansible_distribution == "Ubuntu"

  
  - name: Copy default html file to web servers
    tags: apache,apach2,httpd
    copy:
      src: default_sites.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644



- hosts: db_servers
  become: true
  tasks:

  - name: Install MariaDB package on Rocky
    tags: rockylinux,db,mariadb
    dnf:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Rocky"

  - name: Install MariaDB package on Ubuntu
    tags: db,mariadb,ubuntu
    apt:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Ubuntu"



- hosts: file_servers
  become: true
  tasks:

  - name: Install Samba packages
    tags: samba
    package:
      name: samba
      state: latest

