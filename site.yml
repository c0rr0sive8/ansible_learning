---

- hosts: all
  become: true
  pre_tasks:


  - name: install updates on Rocky
    tags: always
    dnf:
      name: "*"
      state: latest
    when: ansible_distribution == "Rocky"


  - name: install update on Ubuntu
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"





- hosts: web_servers
  become: true
  tasks:


  - name: Install the Apache & PHP-Common package on Rocky
    tags: apache,rockylinux,httpd
    dnf:
      name:
        - httpd
        - php-common
      state: latest
    when: ansible_distribution == "Rocky"


  - name: Install the Apache & PHP-Common package on Ubuntu
    tags: apache,apache2,ubuntu
    apt:
      name:
        - apache2
        - php-common
      state: latest
    when: ansible_distribution == "Ubuntu"


- hosts: db_servers
  become: true
  tasks:

  - name: Install MariaDB package on Rocky
    tags: rockylinux,db,mariadb
    dnf:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Rocky"

  - name: Install MariaDB package on Ubuntu
    tags: db,mariadb,ubuntu
    apt:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Ubuntu"



- hosts: file_servers
  become: true
  tasks:

  - name: Install Samba packages
    tags: samba
    package:
      name: samba
      state: latest

