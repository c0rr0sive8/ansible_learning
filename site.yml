---

- hosts: all
  become: true
  pre_tasks:


  - name: install updates on Rocky
    tags: always
    dnf:
      name: "*"
      state: latest
    when: ansible_distribution == "Rocky"


  - name: install update on Ubuntu
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"



- hosts: workstations
  become: true
  tasks:

  - name: Install unzip
    package:
      name: unzip
      state: latest

  - name: Install terraform
    unarchive:
      src: https://releases.hashicorp.com/terraform/1.17.1/terraform_1.17.1_linux_amd64.zip
      dest: /usr/local/bin
      remote_src: yes
      mode: 0755
      owner: root
      group: root




- hosts: web_servers
  become: true
  tasks:


  - name: Install the Apache & PHP-Common package on Rocky
    tags: apache,rockylinux,httpd
    dnf:
      name:
        - httpd
        - php-common
      state: latest
    when: ansible_distribution == "Rocky"


  - name: Install the Apache & PHP-Common package on Ubuntu
    tags: apache,apache2,ubuntu
    apt:
      name:
        - apache2
        - php-common
      state: latest
    when: ansible_distribution == "Ubuntu"

  
  - name: Copy default html file to web servers
    tags: apache,apach2,httpd
    copy:
      src: default_sites.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644



- hosts: db_servers
  become: true
  tasks:

  - name: Install MariaDB package on Rocky
    tags: rockylinux,db,mariadb
    dnf:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Rocky"

  - name: Install MariaDB package on Ubuntu
    tags: db,mariadb,ubuntu
    apt:
      name: mariadb-server
      state: latest
    when: ansible_distribution == "Ubuntu"



- hosts: file_servers
  become: true
  tasks:

  - name: Install Samba packages
    tags: samba
    package:
      name: samba
      state: latest

